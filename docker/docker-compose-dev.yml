# =============================================================================
# DEV Environment - Docker Compose
# =============================================================================
# Ports: MySQL 3318, Redis 6389, Kafka 29102, Zookeeper 2191
# Usage: docker-compose -f docker/docker-compose-dev.yml up -d
# =============================================================================

version: '3.8'

services:
  # MySQL Database
  auth-mysql-dev:
    image: mysql:8.0
    container_name: auth-mysql-dev
    ports:
      - "3318:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_secret
      MYSQL_DATABASE: quckapp_auth_dev
      MYSQL_USER: quckapp_dev
      MYSQL_PASSWORD: dev_password
    volumes:
      - auth_mysql_dev_data:/var/lib/mysql
    networks:
      - auth-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdev_root_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis
  auth-redis-dev:
    image: redis:7-alpine
    container_name: auth-redis-dev
    ports:
      - "6389:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_secret
    volumes:
      - auth_redis_dev_data:/data
    networks:
      - auth-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper
  auth-zookeeper-dev:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: auth-zookeeper-dev
    ports:
      - "2191:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - auth_zookeeper_dev_data:/var/lib/zookeeper/data
    networks:
      - auth-dev-network
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  auth-kafka-dev:
    image: confluentinc/cp-kafka:7.5.0
    container_name: auth-kafka-dev
    ports:
      - "9102:9092"
      - "29102:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: auth-zookeeper-dev:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://auth-kafka-dev:9092,PLAINTEXT_HOST://localhost:29102
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - auth_kafka_dev_data:/var/lib/kafka/data
    depends_on:
      auth-zookeeper-dev:
        condition: service_healthy
    networks:
      - auth-dev-network
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  auth_mysql_dev_data:
  auth_redis_dev_data:
  auth_zookeeper_dev_data:
  auth_kafka_dev_data:

networks:
  auth-dev-network:
    driver: bridge
