# =============================================================================
# LIVE Environment - Docker Compose
# =============================================================================
# Ports: MySQL 3388, Redis 6459, Kafka 29172, Zookeeper 2261
# Usage: docker-compose -f docker/docker-compose-live.yml up -d
# WARNING: For local testing only. Use managed services in actual live environment.
# =============================================================================

version: '3.8'

services:
  # MySQL Database
  auth-mysql-live:
    image: mysql:8.0
    container_name: auth-mysql-live
    ports:
      - "3388:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-live_root_secret}
      MYSQL_DATABASE: quckapp_auth
      MYSQL_USER: ${MYSQL_USER:-quckapp_live}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-live_password}
    volumes:
      - auth_mysql_live_data:/var/lib/mysql
    networks:
      - auth-live-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-live_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis
  auth-redis-live:
    image: redis:7-alpine
    container_name: auth-redis-live
    ports:
      - "6459:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-live_redis_secret}
    volumes:
      - auth_redis_live_data:/data
    networks:
      - auth-live-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-live_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper
  auth-zookeeper-live:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: auth-zookeeper-live
    ports:
      - "2261:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - auth_zookeeper_live_data:/var/lib/zookeeper/data
    networks:
      - auth-live-network
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  auth-kafka-live:
    image: confluentinc/cp-kafka:7.5.0
    container_name: auth-kafka-live
    ports:
      - "9172:9092"
      - "29172:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: auth-zookeeper-live:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://auth-kafka-live:9092,PLAINTEXT_HOST://localhost:29172
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - auth_kafka_live_data:/var/lib/kafka/data
    depends_on:
      auth-zookeeper-live:
        condition: service_healthy
    networks:
      - auth-live-network
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  auth_mysql_live_data:
  auth_redis_live_data:
  auth_zookeeper_live_data:
  auth_kafka_live_data:

networks:
  auth-live-network:
    driver: bridge
