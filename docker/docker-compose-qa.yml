# =============================================================================
# QA Environment - Docker Compose
# =============================================================================
# Ports: MySQL 3328, Redis 6399, Kafka 29112, Zookeeper 2201
# Usage: docker-compose -f docker/docker-compose-qa.yml up -d
# =============================================================================

version: '3.8'

services:
  # MySQL Database
  auth-mysql-qa:
    image: mysql:8.0
    container_name: auth-mysql-qa
    ports:
      - "3328:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qa_root_secret
      MYSQL_DATABASE: quckapp_auth_qa
      MYSQL_USER: quckapp_qa
      MYSQL_PASSWORD: qa_password
    volumes:
      - auth_mysql_qa_data:/var/lib/mysql
    networks:
      - auth-qa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pqa_root_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis
  auth-redis-qa:
    image: redis:7-alpine
    container_name: auth-redis-qa
    ports:
      - "6399:6379"
    command: redis-server --appendonly yes --requirepass qa_redis_secret
    volumes:
      - auth_redis_qa_data:/data
    networks:
      - auth-qa-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "qa_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper
  auth-zookeeper-qa:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: auth-zookeeper-qa
    ports:
      - "2201:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - auth_zookeeper_qa_data:/var/lib/zookeeper/data
    networks:
      - auth-qa-network
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  auth-kafka-qa:
    image: confluentinc/cp-kafka:7.5.0
    container_name: auth-kafka-qa
    ports:
      - "9112:9092"
      - "29112:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: auth-zookeeper-qa:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://auth-kafka-qa:9092,PLAINTEXT_HOST://localhost:29112
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - auth_kafka_qa_data:/var/lib/kafka/data
    depends_on:
      auth-zookeeper-qa:
        condition: service_healthy
    networks:
      - auth-qa-network
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  auth_mysql_qa_data:
  auth_redis_qa_data:
  auth_zookeeper_qa_data:
  auth_kafka_qa_data:

networks:
  auth-qa-network:
    driver: bridge
