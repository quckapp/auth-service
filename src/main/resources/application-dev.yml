# =============================================================================
# DEV Environment Configuration
# =============================================================================
# Development environment for shared team testing
# Run with: -Dspring.profiles.active=dev
# Docker: docker-compose -f docker/docker-compose-dev.yml up -d
# Ports: MySQL 3318, Redis 6389, Kafka 29102
# =============================================================================

server:
  port: 8081
  servlet:
    context-path: /api/auth

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  # MySQL Database - Dev Server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3318}/${DB_NAME:quckapp_auth_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:dev_root_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  # Redis - Dev Server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6389}
      password: ${REDIS_PASSWORD:dev_redis_secret}

  # Kafka - Dev Server
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29102}

  # Flyway
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

# JWT Configuration - Dev
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000  # 7 days
  issuer: quckapp-auth-dev

# OAuth2 Configuration
oauth2:
  frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:https://dev.quckapp.com/auth/callback}
  mobile-deep-link-scheme: ${OAUTH2_MOBILE_SCHEME:quckapp-dev://}

# Security Configuration
security:
  rate-limit:
    enabled: true
    login:
      max-attempts: 10
      window-seconds: 300
      block-duration-seconds: 600
  audit:
    enabled: true
    log-successful-auth: true
    log-failed-auth: true
  encryption:
    key: ${ENCRYPTION_KEY}

# Logging - Moderate verbosity
logging:
  level:
    com.quckapp.auth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
