server:
  port: 8081
  servlet:
    context-path: /api/auth

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3308/quckapp_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root_secret
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: redis_secret

  kafka:
    bootstrap-servers: localhost:29092

  flyway:
    validate-on-migrate: false

# JWT Configuration
jwt:
  secret: bG9jYWwtZGV2LXNlY3JldC1rZXktZm9yLXRlc3Rpbmctb25seS0zMi1jaGFycw==
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: quckapp-auth-local

logging:
  level:
    com.quckapp.auth: DEBUG
    org.springframework.security: DEBUG
