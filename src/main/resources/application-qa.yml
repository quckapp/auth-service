# =============================================================================
# QA Environment Configuration
# =============================================================================
# Quality Assurance environment for testing
# Run with: -Dspring.profiles.active=qa
# Docker: docker-compose -f docker/docker-compose-qa.yml up -d
# Ports: MySQL 3328, Redis 6399, Kafka 29112
# =============================================================================

server:
  port: 8081
  servlet:
    context-path: /api/auth

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  # MySQL Database - QA Server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3328}/${DB_NAME:quckapp_auth_qa}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:qa_root_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  # Redis - QA Server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6399}
      password: ${REDIS_PASSWORD:qa_redis_secret}

  # Kafka - QA Server
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29112}

  # Flyway
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

# JWT Configuration - QA
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000  # 7 days
  issuer: quckapp-auth-qa

# OAuth2 Configuration
oauth2:
  frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:https://qa.quckapp.com/auth/callback}
  mobile-deep-link-scheme: ${OAUTH2_MOBILE_SCHEME:quckapp-qa://}

# Security Configuration
security:
  rate-limit:
    enabled: true
    login:
      max-attempts: 5
      window-seconds: 300
      block-duration-seconds: 900
  audit:
    enabled: true
    log-successful-auth: true
    log-failed-auth: true
  encryption:
    key: ${ENCRYPTION_KEY}

# Logging
logging:
  level:
    com.quckapp.auth: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
