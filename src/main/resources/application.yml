server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1/auth

spring:
  application:
    name: auth-service

  # MySQL Database
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:quckapp_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

  # Flyway Migrations — Source of truth: database/quckapp-mysql repo
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: ${FLYWAY_LOCATIONS:filesystem:${project.basedir}/../../database/quckapp-mysql/services/auth-service,classpath:db/migration}

  # Redis for Session & Rate Limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # OAuth2 Providers
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile, openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          apple:
            client-id: ${APPLE_CLIENT_ID:}
            client-secret: ${APPLE_CLIENT_SECRET:}
            scope: email, name, openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:}
            client-secret: ${FACEBOOK_CLIENT_SECRET:}
            scope: email, public_profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: user:email, read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

promotion:
  service-name: auth-service
  environment: ${ENVIRONMENT:local}

# OAuth2 Custom Configuration
oauth2:
  default-success-url: /
  default-failure-url: /login?error=true
  frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}
  mobile-deep-link-scheme: ${OAUTH2_MOBILE_SCHEME:quckapp://}
  cookie-expire-seconds: 180

# Mail Configuration (under spring context when loaded)
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  smtp-auth: true
  starttls-enable: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  issuer: quckapp-auth

# Security Configuration
security:
  # Rate Limiting
  rate-limit:
    enabled: true
    login:
      max-attempts: 5
      window-seconds: 300        # 5 minutes
      block-duration-seconds: 900 # 15 minutes
    api:
      requests-per-minute: 100
      requests-per-hour: 1000

  # IP Whitelist (optional)
  ip-whitelist:
    enabled: ${IP_WHITELIST_ENABLED:false}
    allowed-ips: ${IP_WHITELIST:}

  # Session Management
  session:
    max-sessions-per-user: 5
    session-timeout-minutes: 30

  # Password Policy
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
    max-age-days: 90

  # 2FA Configuration
  two-factor:
    enabled: true
    issuer: QuckApp
    code-length: 6
    time-step-seconds: 30

  # Audit Logging
  audit:
    enabled: true
    log-successful-auth: true
    log-failed-auth: true
    log-token-operations: true

  # Encryption
  encryption:
    algorithm: AES/GCM/NoPadding
    key: ${ENCRYPTION_KEY:your-32-char-encryption-key-here}

# Phone OTP Configuration
otp:
  phone:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-requests-per-day: 5
    max-requests-per-ip-per-hour: 10
  email:
    length: 6
    expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-requests-per-day: 10
    max-requests-per-ip-per-hour: 20

# Email Mock Configuration (for development)
email:
  mock:
    enabled: ${EMAIL_MOCK_ENABLED:true}

# SMS Configuration (Kafka-based)
sms:
  mock:
    enabled: ${SMS_MOCK_ENABLED:false}
  provider: kafka
  kafka:
    topic: notification.sms.otp
    generic-topic: notification.sms.generic

# API Keys Configuration
api-keys:
  enabled: true
  header-name: X-API-Key
  internal-services:
    - name: nestjs-backend
      key: ${NESTJS_API_KEY:}
      permissions: [READ_USER, VALIDATE_TOKEN]
    - name: elixir-realtime
      key: ${ELIXIR_API_KEY:}
      permissions: [READ_USER, VALIDATE_TOKEN]

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.quckapp.auth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    filter: true
    showExtensions: true
    showCommonExtensions: true
    docExpansion: none
    defaultModelsExpandDepth: 1
    defaultModelExpandDepth: 2
    persistAuthorization: true
    tryItOutEnabled: true
  show-actuator: false
  packages-to-scan: com.quckapp.auth.controller
  paths-to-match: /api/v1/**, /v1/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
