# Integration test configuration for auth-service
# Uses MySQL Testcontainer - datasource properties are dynamically set

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

  # Flyway for database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Mock Redis for integration tests (or use Testcontainer if needed)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  # Mock Kafka for integration tests
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: test-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Disable OAuth2 auto-configuration for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# JWT configuration for tests
jwt:
  secret: test-secret-key-for-integration-tests-must-be-at-least-256-bits-long-for-security-compliance
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: quckapp-auth-test

# Security configuration for tests
security:
  rate-limit:
    enabled: false
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: false
    max-age-days: 90
  two-factor:
    enabled: true
    issuer: QuckApp-Test
    code-length: 6
    time-step-seconds: 30

# OTP configuration for tests
otp:
  phone:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-requests-per-day: 5
    max-requests-per-ip-per-hour: 10

# Logging for integration tests
logging:
  level:
    com.quckapp.auth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
